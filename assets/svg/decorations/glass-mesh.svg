<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="meshGrad1" cx="20%" cy="15%" r="55%" fx="20%" fy="15%">
      <stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#5B8DEF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshGrad2" cx="80%" cy="25%" r="50%" fx="80%" fy="25%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshGrad3" cx="50%" cy="85%" r="60%" fx="50%" fy="85%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <filter id="meshBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="transparent" />

  <g filter="url(#meshBlur)">
    <!-- Top-left Blue ambient orb -->
    <circle cx="280" cy="220" r="260" fill="url(#meshGrad1)" />
    <!-- Top-right Lavender ambient orb -->
    <circle cx="920" cy="280" r="300" fill="url(#meshGrad2)" />
    <!-- Bottom-center Cyan ambient orb -->
    <circle cx="600" cy="680" r="320" fill="url(#meshGrad3)" />
    <!-- Additional floating accent bubble -->
    <circle cx="340" cy="580" r="180" fill="#7C6CF0" fill-opacity="0.15" />
    <circle cx="850" cy="620" r="200" fill="#60A5FA" fill-opacity="0.12" />
  </g>
</svg>
