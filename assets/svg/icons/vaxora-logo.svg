<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="vaxoraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B8DEF" />
      <stop offset="50%" stop-color="#7C6CF0" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="vaxoraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(91, 141, 239, 0.4)" />
      <stop offset="100%" stop-color="rgba(167, 139, 250, 0.1)" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Symbol (Shield + Immunization Capsule + Pulse Droplet) -->
  <g transform="translate(6, 6)">
    <!-- Outer Glow Shield -->
    <path d="M24 3 C36 3 44 9 44 20 C44 33 28 42 24 45 C20 42 4 33 4 20 C4 9 12 3 24 3 Z" 
          fill="url(#vaxoraGlow)" />
    <!-- Main Gradient Shield Border -->
    <path d="M24 4 C34 4 42 9.5 42 19.5 C42 31 27.5 39.5 24 42 C20.5 39.5 6 31 6 19.5 C6 9.5 14 4 24 4 Z" 
          stroke="url(#vaxoraGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Stylized Medical Cross / Syringe Protection Spark -->
    <path d="M24 12 L24 28" stroke="url(#vaxoraGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M16 20 L32 20" stroke="url(#vaxoraGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Pure Droplet at Heart of Shield -->
    <circle cx="24" cy="20" r="3.5" fill="#FFFFFF" filter="url(#softGlow)"/>
    <circle cx="34" cy="11" r="2.5" fill="#A78BFA" opacity="0.8"/>
  </g>

  <!-- Typography: VAXORA -->
  <text x="64" y="36" font-family="Plus Jakarta Sans, Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="25" font-weight="800" letter-spacing="1.5" fill="currentColor">
    VAX<tspan fill="url(#vaxoraGrad)">ORA</tspan>
  </text>
  <!-- Subtitle Tag -->
  <text x="65" y="48" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.2" fill="#8E9CB2">
    IMMUNIZATION OS
  </text>
</svg>
